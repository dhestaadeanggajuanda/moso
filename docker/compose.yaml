# Layanan pendukung untuk development lokal.
# Jalankan dari root proyek:  composer docker:up
# (= docker compose -f docker/compose.yaml --env-file .env up -d)
# Profil Garage (alternatif RustFS):  docker compose -f docker/compose.yaml --env-file .env --profile garage up -d garage

name: moso

services:
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - '127.0.0.1:${DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
            MYSQL_DATABASE: ${DB_DATABASE:-moso}
            MYSQL_USER: ${DB_USERNAME:-moso}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-u',
                    'root',
                    '-p${DB_ROOT_PASSWORD}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    rustfs:
        image: rustfs/rustfs:1.0.1
        restart: unless-stopped
        ports:
            - '127.0.0.1:${RUSTFS_API_PORT:-9100}:9000'
            - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9101}:9001'
        environment:
            RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID wajib diisi di .env}
            RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY wajib diisi di .env}
            RUSTFS_ADDRESS: ':9000'
            RUSTFS_CONSOLE_ADDRESS: ':9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_OBS_LOGGER_LEVEL: error
        command: ['/data']
        volumes:
            - rustfs-data:/data

    # Membuat bucket publik (anonymous GetObject saja, tanpa ListBucket) dan bucket privat.
    storage-init:
        image: amazon/aws-cli:2.38.1
        depends_on:
            - rustfs
        restart: 'no'
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
            AWS_REQUEST_CHECKSUM_CALCULATION: when_required
            AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
            S3_ENDPOINT: http://rustfs:9000
            PUBLIC_BUCKET: ${AWS_BUCKET:-moso-public}
            PRIVATE_BUCKET: ${AWS_PRIVATE_BUCKET:-moso-private}
        volumes:
            - ./storage/init-buckets.sh:/init-buckets.sh:ro
        entrypoint: ['/bin/sh', '/init-buckets.sh']

    mailpit:
        image: axllent/mailpit:v1.31.6
        restart: unless-stopped
        ports:
            - '127.0.0.1:${MAILPIT_UI_PORT:-8125}:8025'
            - '127.0.0.1:${MAIL_PORT:-1125}:1025'

    # Alternatif RustFS. Butuh langkah layout/key/bucket sekali jalan, lihat docs/STORAGE-S3.md.
    garage:
        image: dxflrs/garage:v2.4.1
        profiles: ['garage']
        restart: unless-stopped
        ports:
            - '127.0.0.1:3900:3900'
            - '127.0.0.1:3902:3902'
        environment:
            GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
            GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
        volumes:
            - ./garage/garage.toml:/etc/garage.toml:ro
            - garage-meta:/var/lib/garage/meta
            - garage-data:/var/lib/garage/data

    # IdP OIDC lokal untuk mencoba login SSO. Realm "moso" diimpor saat start; lihat docs/SSO-ROADMAP.md.
    # docker compose -f docker/compose.yaml --env-file .env --profile sso up -d keycloak
    keycloak:
        image: quay.io/keycloak/keycloak:26.7.5
        profiles: ['sso']
        restart: unless-stopped
        command: ['start-dev', '--import-realm']
        ports:
            - '127.0.0.1:${KEYCLOAK_PORT:-8180}:8080'
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
            MOSO_SSO_CLIENT_ID: ${SSO_CLIENT_ID:-moso-portal}
            MOSO_SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
            # Redirect URI klien = APP_URL persis (buka portal lewat host yang sama, mis. localhost:8010).
            MOSO_APP_URL: ${APP_URL:-http://localhost:8010}
        volumes:
            - ./keycloak:/opt/keycloak/data/import:ro

volumes:
    mysql-data:
    rustfs-data:
    garage-meta:
    garage-data:
