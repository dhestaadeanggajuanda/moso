# Nginx di host server aplikasi moso, di belakang reverse proxy pusat (yang memegang sertifikat HTTPS).
# Salin ke /etc/nginx/conf.d/moso.conf, sesuaikan domain dan port, lalu: nginx -t && systemctl reload nginx
#
# Alur: pengunjung --HTTPS--> proxy pusat --HTTP:80--> Nginx ini --> 127.0.0.1:<APP_HTTP_PORT> (container app)
# Satu blok server per instance dinas. Panduan: docs/DEPLOY.md, bagian "Beberapa dinas di satu server".

# Pertahankan skema dari proxy pusat (https). Tanpa header itu, pakai skema koneksi ini.
map $http_x_forwarded_proto $moso_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Host yang tidak dikenal ditolak tanpa jawaban.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name moso.singkawangkota.go.id;

    # Dokumen PDF maks. 20 MB, gambar maks. 5 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $moso_forwarded_proto;
        # Hanya diteruskan bila proxy pusat mengirimnya; tanpa itu Laravel memakai 443 untuk https.
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name dishub.singkawangkota.go.id;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $moso_forwarded_proto;
        # Hanya diteruskan bila proxy pusat mengirimnya; tanpa itu Laravel memakai 443 untuk https.
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
