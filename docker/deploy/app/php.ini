; Pengaturan PHP produksi moso (ditimpa di atas php.ini-production).

; Jangan bocorkan versi PHP di header (OWASP A02).
expose_php = Off
display_errors = Off
log_errors = On

; Dokumen PDF maks. 20 MB, gambar maks. 5 MB (lihat SecureDocumentService, SecureUploadService).
upload_max_filesize = 21M
post_max_size = 24M

; Re-encode gambar sampai 8000x8000 px butuh memori besar (lihat docs/SECURITY-OWASP.md, risiko diterima).
memory_limit = 512M

; Kode tidak berubah selama container hidup; deploy baru = image baru.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

session.cookie_httponly = 1
