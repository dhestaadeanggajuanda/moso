name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # 8.3 = versi minimum (composer.json), 8.5 = versi image produksi (Dockerfile).
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    # .env.example menargetkan MySQL di Docker lokal; CI cukup memakai SQLite.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare SQLite Database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Audit Dependencies
        run: composer audit:all

      - name: Run CI Checks
        run: composer ci:check

  # Image produksi (FrankenPHP + SSR) harus tetap bisa dibangun. Tidak di-push ke registry mana pun.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app image
        run: docker build --target app -t moso-app:ci .

      - name: Build SSR image
        run: docker build --target ssr -t moso-ssr:ci .

      - name: Smoke test PHP runtime
        run: docker run --rm --entrypoint php moso-app:ci -r 'foreach (["pdo_mysql", "redis", "gd", "intl", "zip", "pcntl"] as $ext) { if (! extension_loaded($ext)) { fwrite(STDERR, "missing $ext\n"); exit(1); } } echo PHP_VERSION, PHP_EOL;'
